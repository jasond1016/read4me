<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>书面编辑器 · 四种体验方案</title>
<style>
:root{--paper:#f3edde;--paper2:#fffaf0;--ink:#26302b;--muted:#716f65;--moss:#536b52;--moss2:#dce4d6;--coral:#d96f59;--line:#d9cfbb;--shadow:0 22px 55px #352f251d;--serif:"Songti SC","STSong","SimSun",serif;--sans:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:var(--sans);background:var(--paper);background-image:radial-gradient(#6d63530d 1px,transparent 1px),linear-gradient(90deg,#ffffff28,transparent 28%);background-size:7px 7px,100% 100%;min-height:100vh}button{font:inherit;color:inherit}.topbar{position:sticky;z-index:30;top:0;background:#fbf6eaeF;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);box-shadow:0 5px 18px #4039230c}.top-inner{max-width:1420px;margin:auto;padding:13px 22px;display:grid;grid-template-columns:minmax(260px,1fr) auto auto;align-items:center;gap:18px}.brand h1{font:700 20px/1.2 var(--serif);margin:0}.brand p{font-size:12px;color:var(--muted);margin:5px 0 0}.switch{display:flex;border:1px solid var(--line);padding:3px;background:#eee6d5;border-radius:10px;gap:2px}.switch button{border:0;background:transparent;border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:650;font-size:13px}.switch button.active{background:var(--ink);color:#fff;box-shadow:0 2px 5px #0002}.viewport-switch button.active{background:var(--moss)}.reset{border:0;background:none;text-decoration:underline;text-underline-offset:3px;color:var(--muted);cursor:pointer;font-size:12px}.comparison{max-width:1420px;margin:15px auto 0;padding:0 22px;display:grid;grid-template-columns:1fr auto;gap:15px;align-items:start}.scheme-info h2{font:700 22px var(--serif);margin:0 0 5px}.scheme-info p{margin:0;color:var(--muted);font-size:13px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{font-size:11px;border:1px solid var(--line);background:#faf5e9;padding:4px 8px;border-radius:99px}.chip.good{border-color:#a9bba4;color:#38503b}.chip.warn{border-color:#e6ad9f;color:#884c3f}.checklist{background:#fff9ec;border:1px solid var(--line);border-radius:11px;padding:9px 12px;max-width:580px}.checklist strong{font:700 12px var(--serif);margin-right:9px}.checklist label{font-size:11px;white-space:nowrap;margin:3px 7px 3px 0;display:inline-flex;gap:4px;align-items:center;cursor:pointer}.checklist input{accent-color:var(--moss)}.stage{padding:17px 20px 50px;display:flex;justify-content:center}.device{width:390px;height:780px;background:#f9f4e8;border:9px solid #333b36;border-radius:34px;box-shadow:var(--shadow),inset 0 0 0 1px #fff5;overflow:hidden;position:relative;transition:width .25s,height .25s,border-radius .25s}.device.pad{width:min(1100px,calc(100vw - 40px));height:720px;border-radius:23px}.screen{height:100%;overflow:auto;position:relative;background:linear-gradient(105deg,#fbf6e9,#f2ead9)}.phone-notch{height:18px;width:112px;background:#333b36;position:absolute;z-index:20;top:0;left:50%;transform:translateX(-50%);border-radius:0 0 11px 11px}.pad .phone-notch{width:9px;height:9px;border-radius:50%;top:8px}.apphead{padding:29px 16px 12px;border-bottom:1px solid var(--line);background:#fff9ed;position:relative}.apphead .eyebrow{font-size:10px;letter-spacing:.15em;color:var(--coral);font-weight:bold}.apphead h3{font:700 17px/1.35 var(--serif);margin:4px 0 0}.pad .apphead{padding:24px 25px 13px}.spread-list{padding:10px;display:grid;gap:8px}.spread-card{border:1px solid var(--line);background:#fffaf0;border-radius:12px;padding:8px;display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;cursor:pointer;position:relative;box-shadow:0 2px 0 #b8aa8e16}.spread-card.selected{border-color:var(--moss);box-shadow:inset 3px 0 var(--moss)}.thumb,.hero-art{position:relative;overflow:hidden;background:linear-gradient(150deg,#bfcdb9 0 44%,#e3bc93 44%);border-radius:8px;min-height:58px}.thumb:before,.hero-art:before{content:"";position:absolute;width:45%;height:43%;background:#657c61;border-radius:50% 50% 8px 8px;bottom:5%;left:9%;box-shadow:40px -17px 0 -7px #d7725c}.thumb:after,.hero-art:after{content:"";position:absolute;width:22%;height:22%;border:3px solid #fff7;border-radius:50%;top:13%;right:11%}.card-title{font:700 14px var(--serif)}.meta{font-size:11px;color:var(--muted);margin-top:5px;display:flex;gap:7px;flex-wrap:wrap}.status{color:#536b52}.status.alert{color:#b25442}.iconbtn,.play,.action{border:1px solid var(--line);background:#fffaf1;border-radius:9px;cursor:pointer;min-width:35px;min-height:35px}.play{border-radius:50%;color:var(--moss);font-weight:bold}.play.playing{background:var(--coral);color:white;border-color:var(--coral)}.iconbtn:hover,.action:hover{border-color:var(--moss)}button:focus-visible,input:focus-visible{outline:3px solid #d96f5975;outline-offset:2px}.popover{position:absolute;z-index:15;right:8px;top:54px;width:168px;padding:6px;background:#fffdf6;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px #332b1d30}.popover button{display:block;width:100%;border:0;background:none;text-align:left;padding:9px;border-radius:6px;cursor:pointer}.popover button:hover{background:var(--moss2)}.popover .danger{color:#a54436}.editor{background:#f8f1e3;min-height:100%;position:relative}.editor-head{height:58px;display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line);background:#fff9ed;position:sticky;top:0;z-index:8}.editor-head b{font-family:var(--serif)}.back{border:0;background:none;font-size:18px;cursor:pointer}.tabs{display:flex;border-bottom:1px solid var(--line);background:#fff9ed;padding:0 10px}.tabs button{flex:1;border:0;border-bottom:3px solid transparent;background:none;padding:11px 4px;font-size:12px;cursor:pointer}.tabs button.active{border-color:var(--coral);font-weight:bold}.editor-body{padding:16px}.wave-wrap{background:#3b4740;border-radius:12px;padding:15px 12px 12px;color:#fff;position:relative}.wave{height:66px;display:flex;align-items:center;gap:2px;overflow:hidden}.bar{display:block;flex:1;background:#cbd7c4;border-radius:3px;min-width:2px}.range{width:100%;accent-color:var(--coral);cursor:pointer}.range-row{display:flex;justify-content:space-between;font-size:11px;color:#dbded8}.dual{position:relative;height:27px}.dual input{position:absolute;left:0;top:2px;pointer-events:none}.dual input::-webkit-slider-thumb{pointer-events:auto}.progress{position:absolute;top:15px;bottom:39px;width:2px;background:var(--coral);left:12%;transition:left .2s}.section-title{font:700 15px var(--serif);margin:18px 0 9px;display:flex;justify-content:space-between}.actions{display:flex;gap:8px;flex-wrap:wrap}.action{padding:8px 11px;font-size:12px}.action.primary{background:var(--moss);color:#fff;border-color:var(--moss)}.action.coral{background:var(--coral);color:#fff;border-color:var(--coral)}.ref-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ref{border:1px solid var(--line);background:#fffaf0;border-radius:11px;padding:8px}.ref .thumb{height:105px}.quality{display:flex;justify-content:space-between;margin-top:7px;font-size:11px}.settings-row{border-bottom:1px dashed var(--line);padding:13px 2px;display:flex;justify-content:space-between;align-items:center}.danger-zone{border:1px solid #dfaea3;background:#fff5ef;border-radius:10px;padding:12px;margin-top:18px}.master-detail{display:grid;grid-template-columns:330px 1fr;height:calc(100% - 76px)}.master-detail>.spread-list{overflow:auto;border-right:1px solid var(--line);align-content:start}.master-detail>.editor{overflow:auto}.modebar{display:flex;padding:8px 10px;gap:6px;border-bottom:1px solid var(--line);background:#fff8ec}.modebar button{flex:1;border:0;background:transparent;padding:8px;border-radius:8px;cursor:pointer;font-size:12px}.modebar button.active{background:var(--moss);color:#fff}.task-pad{display:grid;grid-template-columns:94px 1fr;height:calc(100% - 76px)}.task-pad .modebar{flex-direction:column;border-right:1px solid var(--line);border-bottom:0;padding:14px 8px}.task-pad .modebar button{flex:0;padding:12px 5px}.task-content{overflow:auto;padding:10px}.task-content .spread-list{padding:0}.task-pad .spread-list{grid-template-columns:1fr 1fr}.task-card{background:#fffaf0;border:1px solid var(--line);border-radius:12px;padding:10px}.task-card .head{display:flex;align-items:center;gap:9px}.task-card .head .thumb{width:62px}.mini-wave{height:42px;display:flex;align-items:center;gap:2px;background:#3e4942;border-radius:8px;padding:6px;margin:9px 0}.mini-wave i{flex:1;background:#cbd7c4;display:block;border-radius:2px}.organize .task-card{padding-left:39px;position:relative}.handle{position:absolute;left:8px;top:11px;border:0;background:#e7dfcf;border-radius:6px;padding:9px 7px;cursor:pointer}.seam{border:1px dashed #a9a18e;background:transparent;color:var(--muted);padding:6px;border-radius:7px;width:100%;cursor:pointer}.accordion-grid{padding:10px;display:grid;gap:8px}.pad .accordion-grid{grid-template-columns:1fr 1fr;align-items:start}.acc{border:1px solid var(--line);background:#fffaf0;border-radius:12px;overflow:visible;position:relative}.acc.open{grid-column:1/-1;border-color:var(--moss)}.acc-summary{padding:8px;display:grid;grid-template-columns:65px 1fr auto;gap:9px;align-items:center;cursor:pointer}.acc-body{padding:4px 12px 13px;border-top:1px dashed var(--line);animation:reveal .2s}.more-panel{margin-top:9px;background:#eee5d3;border-left:3px solid var(--coral);padding:9px}.focus-layout{padding:12px}.focus-art{height:300px;border:7px solid #fffaf0;box-shadow:0 4px 14px #4539201b}.focus-art:before{width:50%;height:45%;left:15%}.focus-controls{text-align:center;padding:12px}.navrow{display:flex;align-items:center;justify-content:space-between;margin:5px 0 12px}.filmstrip{display:flex;gap:7px;overflow:auto;padding:9px 4px 14px}.film{flex:0 0 70px;border:2px solid transparent;border-radius:9px;padding:3px;background:#fff9ed;cursor:pointer}.film.selected{border-color:var(--coral)}.film .thumb{min-height:47px}.focus-pad{display:grid;grid-template-columns:56% 44%;grid-template-rows:1fr 94px;height:calc(100% - 76px)}.focus-pad .focus-art{height:auto;margin:16px}.focus-pad .focus-controls{overflow:auto;text-align:left;padding:20px}.focus-pad .filmstrip{grid-column:1/-1;border-top:1px solid var(--line);padding:8px 16px}.confirm{position:absolute;z-index:50;inset:0;background:#262d2875;display:flex;align-items:center;justify-content:center;padding:20px}.confirm-box{background:#fffaf0;border:1px solid var(--line);border-radius:14px;padding:20px;max-width:310px;box-shadow:var(--shadow)}.confirm-box h4{font:700 18px var(--serif);margin:0 0 7px}.confirm-box p{font-size:13px;color:var(--muted)}.toast{position:absolute;z-index:60;left:50%;bottom:20px;transform:translateX(-50%);background:#28332d;color:white;padding:9px 14px;border-radius:8px;font-size:12px;box-shadow:0 7px 24px #0004;white-space:nowrap;animation:toast .25s}.hidden{display:none!important}@keyframes reveal{from{opacity:0;transform:translateY(-8px)}}@keyframes toast{from{opacity:0;transform:translate(-50%,8px)}}
@keyframes audioProgress{from{left:12%}to{left:88%}}.progress{animation:audioProgress 8s linear infinite}
@media(max-width:760px){.top-inner{grid-template-columns:1fr;padding:10px 14px;gap:9px}.top-inner>div:last-child{display:flex;justify-content:space-between}.comparison{grid-template-columns:1fr;padding:0 14px}.device.pad{width:calc(100vw - 16px);border-width:5px}.stage{padding:14px 5px 40px}.brand p{display:none}.checklist{max-width:none}.comparison{margin-top:10px}.scheme-info h2{font-size:18px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar"><div class="top-inner">
  <div class="brand"><h1>书面详情编辑 · 体验比较台</h1><p>在同一内容中比较渐进披露方式；所有操作仅用于体验。</p></div>
  <nav class="switch" aria-label="方案选择"><button data-scheme="A">A</button><button data-scheme="B">B</button><button data-scheme="C">C</button><button data-scheme="D">D</button></nav>
  <div><nav class="switch viewport-switch" aria-label="设备选择"><button data-view="phone">手机</button><button data-view="pad">Pad</button></nav><button class="reset" id="reset">重置当前方案</button></div>
</div></header>
<section class="comparison"><div class="scheme-info"><h2 id="schemeTitle"></h2><p id="schemeDesc"></p><div class="chips" id="chips"></div></div>
<aside class="checklist" aria-label="体验检查清单"><strong>边用边记</strong><label><input type="checkbox">返回是否容易</label><label><input type="checkbox">试听是否顺手</label><label><input type="checkbox">修剪是否好理解</label><label><input type="checkbox">低频操作是否碍眼</label><label><input type="checkbox">Pad 空间是否充分</label></aside></section>
<main class="stage"><div class="device" id="device"><div class="phone-notch"></div><div class="screen" id="screen"></div></div></main>
<script>
(()=>{
const spreads=[
 {n:1,d:'00:38',s:'已录好',detail:'原始录音',q:'清晰'},
 {n:2,d:'00:42',s:'已修剪',detail:'前后各剪去 1.2 秒',q:'清晰'},
 {n:3,d:'01:06',s:'两段录音',detail:'片段 1 · 片段 2',q:'清晰'},
 {n:4,d:'00:29',s:'图片稍糊',detail:'建议重新拍摄',q:'稍模糊',alert:true},
 {n:5,d:'00:51',s:'已录好',detail:'环境声较轻',q:'良好'},
 {n:6,d:'00:47',s:'待确认',detail:'修剪尚未保存',q:'清晰'}];
const schemes={A:{title:'A. 简洁列表 + 自适应书面编辑器',desc:'浏览时只保留判断所需信息；进入后再专注完成一类编辑。',chips:[['推荐方案','good'],['上下文切换清楚','good'],['手机多一步进入','warn']]},B:{title:'B. 任务模式',desc:'先说明“现在要做什么”，同类任务批量处理。',chips:[['批量效率高','good'],['功能边界清楚','good'],['需理解模式','warn']]},C:{title:'C. 手风琴卡片',desc:'在列表原位展开，维持书面上下文，同时暴露当前操作。',chips:[['就地编辑','good'],['学习成本低','good'],['容易跳动与变长','warn']]},D:{title:'D. 单书面聚焦编辑器',desc:'一次只看一个书面，用沉浸画面支持精细检查与叙述。',chips:[['视觉专注','good'],['适合逐页检查','good'],['全局概览较弱','warn']]}};
let state={scheme:'A',view:'phone',selected:2,tab:'audio',mode:'browse',open:1,more:false,playing:null,pop:null,trim:82};
const screen=document.querySelector('#screen'),device=document.querySelector('#device');
const bars=(count=35)=>Array.from({length:count},(_,i)=>`<span class="bar" style="height:${18+((i*17+i*i*3)%45)}px"></span>`).join('');
const mini=()=>`<div class="mini-wave" aria-label="音频波形">${Array.from({length:30},(_,i)=>`<i style="height:${8+(i*13)%28}px"></i>`).join('')}</div>`;
const art=(n,cls='thumb')=>`<div class="${cls}" aria-label="书面 ${n} 插图占位"></div>`;
function header(){return `<header class="apphead"><span class="eyebrow">家庭书架 · 共 6 个书面</span><h3>屁屁侦探—紫衣夫人的宝藏之谜</h3></header>`}
function play(n){return `<button class="play ${state.playing===n?'playing':''}" data-act="play" data-n="${n}" aria-label="${state.playing===n?'暂停':'试听'}书面 ${n}">${state.playing===n?'Ⅱ':'▶'}</button>`}
function popover(n){return state.pop===n?`<div class="popover"><button data-act="insert">在后面插入书面</button><button data-act="merge">与下一书面合并</button><button data-act="recapture">重新拍摄</button><button class="danger" data-act="delete">删除这个书面…</button></div>`:''}
function card(x,click=true){return `<article class="spread-card ${state.selected===x.n?'selected':''}" data-act="${click?'select':''}" data-n="${x.n}">${art(x.n)}<div><div class="card-title">书面 ${x.n}</div><div class="meta"><span>${x.d}</span><span class="status ${x.alert?'alert':''}">${x.s}</span></div></div><div>${play(x.n)}<button class="iconbtn" data-act="pop" data-n="${x.n}" aria-label="书面 ${x.n} 更多操作">•••</button></div>${popover(x.n)}</article>`}
function wave(n,big=true){return `<div class="wave-wrap"><div class="wave">${bars(big?42:28)}</div>${state.playing===n?`<i class="progress" style="left:${12+(Date.now()/40%70)}%"></i>`:''}<div class="dual"><input class="range" data-act="trimStart" type="range" min="0" max="35" value="8" aria-label="修剪起点"><input class="range" data-act="trimEnd" type="range" min="40" max="100" value="${state.trim}" aria-label="修剪终点"></div><div class="range-row"><span>00:03.2</span><span id="trimVal">00:${Math.round(state.trim*.42).toString().padStart(2,'0')}.0</span></div></div>`}
function editor(n,withBack){let x=spreads[n-1];let content='';if(state.tab==='audio')content=`<div class="section-title"><span>保留的声音范围</span><small>${x.detail}</small></div>${wave(n)}<div class="section-title">试听与录制</div><div class="actions">${play(n)}<button class="action primary" data-act="preview" data-n="${n}">试听修剪结果</button><button class="action" data-act="restore">恢复原始范围</button><button class="action coral" data-act="rerecord">重新录制</button></div>`;if(state.tab==='refs')content=`<div class="section-title">图片与参考</div><div class="ref-grid"><div class="ref">${art(n)}<div class="quality"><b>主要书面</b><span>${x.q}</span></div></div><div class="ref">${art(n)}<div class="quality"><b>构图参考</b><span>清晰</span></div></div></div><div class="actions" style="margin-top:12px"><button class="action primary" data-act="recapture">重新拍摄主要书面</button><button class="action">添加参考图</button></div>`;if(state.tab==='settings')content=`<div class="section-title">书面顺序与结构</div><div class="settings-row"><span>当前顺序</span><b>第 ${n} / 6 个</b></div><div class="settings-row"><span>低频结构操作</span><button class="action" data-act="revealDanger">展开…</button></div>${state.more?`<div class="danger-zone"><b>请谨慎操作</b><p>结构调整会影响孩子连续播放故事的顺序。</p><div class="actions"><button class="action" data-act="insert">插入</button><button class="action" data-act="merge">与下一书面合并</button><button class="action coral" data-act="delete">删除…</button></div></div>`:''}`;return `<section class="editor">${withBack?`<div class="editor-head"><button class="back" data-act="back" aria-label="返回书面列表">←</button><b>书面 ${n}</b><span class="meta">${x.d} · ${x.s}</span></div>`:''}<nav class="tabs"><button data-tab="audio" class="${state.tab==='audio'?'active':''}">音频</button><button data-tab="refs" class="${state.tab==='refs'?'active':''}">参考图</button><button data-tab="settings" class="${state.tab==='settings'?'active':''}">书面设置</button></nav><div class="editor-body">${content}</div></section>`}
function renderA(){if(state.view==='phone'&&state.inEditor)return editor(state.selected,true);let list=spreads.map(x=>card(x)).join('');return header()+(state.view==='pad'?`<div class="master-detail"><div class="spread-list">${list}</div>${editor(state.selected,false)}</div>`:`<div class="spread-list">${list}</div>`)}
function taskCard(x){let extra=state.mode==='audio'?`${wave(x.n,false)}<div class="actions">${play(x.n)}<button class="action" data-act="restore">恢复</button></div>`:state.mode==='image'?`<div class="ref-grid" style="margin-top:9px"><div class="ref">${art(x.n)}<div class="quality"><span>${x.q}</span></div></div><button class="action" data-act="recapture">重新拍摄</button></div>`:state.mode==='organize'?`<button class="handle" data-act="move" data-n="${x.n}" aria-label="将书面 ${x.n} 上移">☷</button><div class="actions"><button class="action" data-act="move" data-n="${x.n}">上移</button><button class="action" data-act="merge">合并</button><button class="action" data-act="delete">删除…</button></div><button class="seam" data-act="insert">＋ 在这里插入书面</button>`:'';return `<article class="task-card ${state.mode==='organize'?'organize':''}"><div class="head">${art(x.n)}<div><b>书面 ${x.n}</b><div class="meta">${x.d} · ${x.s}</div></div>${state.mode==='browse'?play(x.n):''}</div>${extra}</article>`}
function renderB(){let modes=[['browse','浏览'],['audio','音频'],['image','图片'],['organize','整理']];let nav=`<nav class="modebar">${modes.map(m=>`<button class="${state.mode===m[0]?'active':''}" data-mode="${m[0]}">${m[1]}</button>`).join('')}</nav>`;return header()+`<div class="${state.view==='pad'?'task-pad':''}">${nav}<div class="task-content"><div class="spread-list">${spreads.map(taskCard).join('')}</div></div></div>`}
function renderC(){return header()+`<div class="accordion-grid">${spreads.map(x=>`<article class="acc ${state.open===x.n?'open':''}"><div class="acc-summary" data-act="acc" data-n="${x.n}">${art(x.n)}<div><b>书面 ${x.n}</b><div class="meta">${x.d} · ${x.s}</div></div>${play(x.n)}</div>${state.open===x.n?`<div class="acc-body">${wave(x.n,false)}<div class="actions"><button class="action primary" data-act="preview" data-n="${x.n}">试听结果</button><button class="action coral" data-act="rerecord">重录</button><button class="action" data-act="more">更多</button></div>${state.more?`<div class="more-panel">结构操作会让卡片继续变高。<div class="actions"><button class="action" data-act="insert">插入</button><button class="action" data-act="merge">合并</button><button class="action" data-act="delete">删除…</button></div></div>`:''}</div>`:''}</article>`).join('')}</div>`}
function focusControls(x){return `<div class="focus-controls"><div class="navrow"><button class="action" data-act="prev">← 上一书面</button><b>书面 ${x.n} <span class="meta">${x.d} · ${x.s}</span></b><button class="action" data-act="next">下一书面 →</button></div><div class="section-title">叙述声音</div>${wave(x.n)}<div class="actions" style="margin-top:12px">${play(x.n)}<button class="action primary" data-act="preview" data-n="${x.n}">试听修剪结果</button><button class="action coral" data-act="rerecord">重新录制</button><button class="iconbtn" data-act="pop" data-n="${x.n}">•••</button></div>${popover(x.n)}</div>`}
function film(){return `<div class="filmstrip" aria-label="书面胶片条">${spreads.map(x=>`<button class="film ${state.selected===x.n?'selected':''}" data-act="film" data-n="${x.n}">${art(x.n)}<small>${x.n}</small></button>`).join('')}</div>`}
function renderD(){let x=spreads[state.selected-1];return header()+(state.view==='pad'?`<div class="focus-pad">${art(x.n,'hero-art focus-art')}${focusControls(x)}${film()}</div>`:`<div class="focus-layout">${art(x.n,'hero-art focus-art')}${focusControls(x)}${film()}</div>`)}
function render(){let s=schemes[state.scheme];document.querySelector('#schemeTitle').textContent=s.title;document.querySelector('#schemeDesc').textContent=s.desc;document.querySelector('#chips').innerHTML=s.chips.map(c=>`<span class="chip ${c[1]}">${c[0]}</span>`).join('');document.querySelectorAll('[data-scheme]').forEach(b=>b.classList.toggle('active',b.dataset.scheme===state.scheme));document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));device.classList.toggle('pad',state.view==='pad');screen.innerHTML=({A:renderA,B:renderB,C:renderC,D:renderD})[state.scheme]();}
let toastTimer;function toast(msg){document.querySelector('.toast')?.remove();let t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;device.append(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),2100)}
function confirmBox(){let d=document.createElement('div');d.className='confirm';d.innerHTML=`<div class="confirm-box" role="dialog" aria-modal="true"><h4>要删除这个书面吗？</h4><p>录音和参考图将一起移除。交互原型不会真的删除数据。</p><div class="actions"><button class="action" data-act="cancel">取消</button><button class="action coral" data-act="fakeDelete">仍要删除</button></div></div>`;screen.append(d);d.querySelector('button').focus()}
document.addEventListener('click',e=>{let b=e.target.closest('button,[data-act]');if(!b)return;if(b.dataset.scheme){state.scheme=b.dataset.scheme;Object.assign(state,{selected:2,tab:'audio',mode:'browse',open:1,more:false,playing:null,pop:null,inEditor:false});render();return}if(b.dataset.view){state.view=b.dataset.view;state.inEditor=false;render();return}if(b.dataset.tab){state.tab=b.dataset.tab;state.more=false;render();return}if(b.dataset.mode){state.mode=b.dataset.mode;render();return}let n=+b.dataset.n,a=b.dataset.act;if(a==='select'){state.selected=n;state.inEditor=state.view==='phone';state.pop=null}else if(a==='back')state.inEditor=false;else if(a==='play'||a==='preview'){n=n||state.selected;state.playing=state.playing===n?null:n;toast(state.playing?`正在试听书面 ${n}`:`已暂停书面 ${n}`)}else if(a==='pop'){state.pop=state.pop===n?null:n}else if(a==='acc'){state.open=state.open===n?null:n;state.more=false}else if(a==='more'||a==='revealDanger')state.more=!state.more;else if(a==='film'){state.selected=n;state.pop=null}else if(a==='prev')state.selected=Math.max(1,state.selected-1);else if(a==='next')state.selected=Math.min(6,state.selected+1);else if(a==='restore'){state.trim=100;toast('已恢复原始范围')}else if(a==='delete')return confirmBox();else if(a==='cancel')return b.closest('.confirm').remove();else if(a==='fakeDelete'){b.closest('.confirm').remove();toast('这是交互原型，不会真的删除')}else if(a==='move')toast(n===1?'书面 1 已经在最前面':`书面 ${n} 已模拟上移`);else if(a==='merge')toast('已预览合并效果，原数据未改变');else if(a==='insert')toast('已标记插入位置');else if(a==='recapture')toast('已进入模拟拍摄流程');else if(a==='rerecord')toast('录音准备中…');render()});
screen.addEventListener('input',e=>{if(e.target.dataset.act==='trimEnd'){state.trim=+e.target.value;document.querySelector('#trimVal')?.replaceChildren(`00:${Math.round(state.trim*.42).toString().padStart(2,'0')}.0`);toast(`结束位置调整到 ${e.target.value}%`)}else if(e.target.dataset.act==='trimStart')toast(`起始位置调整到 ${e.target.value}%`)});
document.querySelector('#reset').addEventListener('click',()=>{let keep={scheme:state.scheme,view:state.view};state={...keep,selected:2,tab:'audio',mode:'browse',open:1,more:false,playing:null,pop:null,trim:82};render();toast('当前方案已重置')});
render();
})();
</script>
</body>
</html>
